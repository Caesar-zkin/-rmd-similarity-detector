name: Module tests

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

permissions:
  contents: read

jobs:
  modules:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: false

      - name: Run parser tests
        run: Rscript tests/test-parser.R

      - name: Run text tests
        run: Rscript tests/test-text.R

      - name: Run exact matching and coverage tests
        run: Rscript tests/test-text-matches.R

      - name: Run file-to-file text demo
        run: Rscript examples/run-text-demo.R

      - name: Run approximate matching tests
        run: Rscript tests/test-text-approx.R

      - name: Run artificial edit demonstration
        run: Rscript examples/run-text-approx-demo.R

      - name: Run Markdown normalization tests
        run: Rscript tests/test-text-markdown.R

      - name: Run Markdown normalization demonstration
        run: Rscript examples/run-text-markdown-demo.R

      - name: Run formula foundation tests
        run: Rscript tests/test-math.R

      - name: Run formula demonstration
        run: Rscript examples/run-math-demo.R

      - name: Run formula sequence tests
        run: Rscript tests/test-math-sequences.R

      - name: Run formula sequence demonstration
        run: Rscript examples/run-math-sequence-demo.R

      - name: Run multiline formula tests
        run: Rscript tests/test-math-multiline.R

      - name: Run multiline formula demonstration
        run: Rscript examples/run-math-multiline-demo.R
