name: Parser tests

on:
  push:
    branches: [main, feat/parser]
  pull_request:

permissions:
  contents: read

jobs:
  parser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: false
      - name: Run structural parser assertions
        run: Rscript tests/test-parser.R
